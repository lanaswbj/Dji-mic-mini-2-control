[package]
name = "djimic-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop control app for DJI wireless microphones."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
device = { workspace = true }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
# Silero VAD (neural-net voice activity detector) and spectral-flux onset
# novelty — see gui/src-tauri/src/mic_tap.rs's module doc comment for why.
voice_activity_detector = "0.2.1"
microdsp = "0.1.3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[[bin]]
name = "djimic-gui"
path = "src/main.rs"

[features]
# Enabled automatically by `cargo tauri build`; makes the binary serve its
# embedded frontend instead of connecting to the dev server. Do not remove.
custom-protocol = ["tauri/custom-protocol"]
