[package]
name = "djimic-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop control app for DJI wireless microphones."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
device = { workspace = true }
tap-model = { workspace = true }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
# VAD, spectral-flux novelty, and the trained classifier itself all now
# live behind `tap-model` (see gui/src-tauri/src/mic_tap.rs's module doc
# comment and crates/tap-model's own doc comment) — no direct dependency
# on `earshot`/`microdsp` here.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[[bin]]
name = "djimic-gui"
path = "src/main.rs"

[features]
# Enabled automatically by `cargo tauri build`; makes the binary serve its
# embedded frontend instead of connecting to the dev server. Do not remove.
custom-protocol = ["tauri/custom-protocol"]
