[package]
name = "detect-test"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# Standalone crate, deliberately outside the workspace in ../../Cargo.toml —
# this exists only to test pairing-button and mic-tap detection in isolation,
# without going through the full Tauri app rebuild/relaunch cycle.

[dependencies]
cpal = "0.15"
serde_json = "1"
# Cross-workspace path dependency — this crate is deliberately its own
# workspace root (see the note above), but a plain path dep doesn't require
# shared workspace membership, so it can still share the model format/
# forward-pass/training/feature-extraction/VAD code with gui/src-tauri via
# crates/tap-model (no direct microdsp/earshot/voice_activity_detector
# dependency here anymore — see that crate's `features` module).
tap-model = { path = "../../crates/tap-model" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_Graphics_Gdi",
] }
